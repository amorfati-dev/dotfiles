# Prefix von Ctrl+B auf Ctrl+A umstellen
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits intuitiver: | für vertikal, - für horizontal
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# Mit den Pfeiltasten zwischen Panes wechseln (nach prefix)
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D

# Mouse-Support (Panes per Klick wechseln, resize per Drag)
set -g mouse on

# Config schnell reloaden mit prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
